name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users-service, orders-service, notif-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [users-service, orders-service, notif-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}